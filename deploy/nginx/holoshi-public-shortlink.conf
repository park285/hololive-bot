# `holoshi-nginx`의 `http` context에 적용하는 short-link public ingress contract입니다.
# `/etc/nginx/tls.conf`, `/etc/nginx/proxy.conf`, `$blocked_request`는 Seoul gateway base config가 소유합니다.

upstream shortlink_backend {
    server 100.100.1.8:30192;
    keepalive 8;
}

limit_req_zone $binary_remote_addr zone=holoshi_shortlink_requests:1m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=holoshi_shortlink_connections:1m;
limit_req_status 429;
limit_conn_status 429;

map $request_uri $kakao_deep_link_target {
    default "";
    ~^/k/m/(?<kakao_message_room_id>[1-9][0-9]*)/(?<kakao_message_id>[1-9][0-9]*)$ "kakaotalk://chats/?chat_id=$kakao_message_room_id&message_id=$kakao_message_id";
    ~^/k/t/(?<kakao_thread_root_room_id>[1-9][0-9]*)/(?<kakao_thread_root_id>[1-9][0-9]*)$ "kakaotalk://chats/?chat_id=$kakao_thread_root_room_id&thread_id=$kakao_thread_root_id";
    ~^/k/t/(?<kakao_thread_child_room_id>[1-9][0-9]*)/(?<kakao_thread_child_thread_id>[1-9][0-9]*)/(?<kakao_thread_child_message_id>[1-9][0-9]*)$ "kakaotalk://chats/?chat_id=$kakao_thread_child_room_id&thread_id=$kakao_thread_child_thread_id&message_id=$kakao_thread_child_message_id";
}

map $http_user_agent $kakao_deep_link_scraper {
    default 0;
    ~*kakaotalk-scrap/ 1;
}

map $request_method $kakao_deep_link_get {
    default 0;
    GET 1;
}

map $uri $shortlink_access_log_enabled {
    default 1;
    ~^/k(?:/|$) 0;
}

server {
    listen 443 ssl;
    listen 443 quic;
    server_name short.holoshi.com;
    include /etc/nginx/tls.conf;
    access_log /dev/stdout ingress_json if=$shortlink_access_log_enabled;

    if ($blocked_request) { return 444; }

    location ^~ /k/ {
        limit_req zone=holoshi_shortlink_requests burst=40 nodelay;
        limit_conn holoshi_shortlink_connections 16;
        access_log off;
        add_header_inherit off;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Vary "User-Agent" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

        if ($kakao_deep_link_target = "") {
            add_header_inherit on;
            return 404;
        }
        if ($kakao_deep_link_scraper) {
            add_header_inherit on;
            return 403;
        }
        if ($kakao_deep_link_get = 0) {
            add_header_inherit on;
            return 403;
        }

        return 302 $kakao_deep_link_target;
    }

    location ^~ /l/ {
        limit_req zone=holoshi_shortlink_requests burst=40 nodelay;
        limit_conn holoshi_shortlink_connections 16;
        include /etc/nginx/proxy.conf;
        proxy_pass http://shortlink_backend;
    }

    location / {
        return 404;
    }
}
