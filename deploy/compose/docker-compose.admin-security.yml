# Mandatory central security overlay. The Rust gateway reads private mounted files.
services:
  admin-dashboard:
    env_file: !override []
    volumes:
      - /run/hololive-bot/iris-admin-credentials:/run/hololive-bot/iris-admin-credentials:ro
    depends_on: !override
      hololive-api:
        condition: service_healthy
    networks: !override
      hololive-net:
        aliases:
          - admin-dashboard
