# iris-seoul hot standby (physical streaming replication from the hololive-osaka primary).
#
# This file owns both standby steady state and the promoted-node restart posture.
# Initial pg_basebackup and failover controller activation are documented in
# docs/current/runbooks/postgres-replication.md.
#
#   docker compose --env-file /etc/stack-secrets/hololive-bot/ap-compose.env \
#     -f deploy/compose/docker-compose.standby.yml up -d holo-postgres-standby

services:
  holo-postgres-standby:
    # alpine 이미지의 postgres는 uid 70이지만 스택 공통으로 999를 쓴다(TwentyQ·ChatBotGo와 동일).
    # user 지정 시 entrypoint의 root 준비 단계가 빠지므로 소켓 tmpfs에 uid/gid를 직접 준다.
    user: "999:999"
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2}
    container_name: holo-postgres-standby
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    command:
      - postgres
      - "-c"
      - "hba_file=/run/hololive-bot/postgres/pg_hba.conf"
      - "-c"
      - "hot_standby=on"
      - "-c"
      - "hot_standby_feedback=on"
      # primary보다 작으면 standby가 기동을 거부한다. 값은 prod primary와 동일하게 둔다.
      - "-c"
      - "max_connections=60"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/run/hololive-bot/postgres-tls/server.crt"
      - "-c"
      - "ssl_key_file=/run/hololive-bot/postgres-tls/server.key"
      - "-c"
      - "primary_conninfo=host=${HOLOLIVE_PRIMARY_HOST:-100.100.1.8} port=${HOLOLIVE_PRIMARY_PORT:-5433} user=${HOLOLIVE_REPLICATOR_USER:-hololive_replicator} sslmode=verify-full sslrootcert=/run/hololive-bot/certs/postgres-ca.pem passfile=/run/hololive-bot/postgres/pgpass application_name=${HOLOLIVE_STANDBY_SLOT:-iris_seoul_standby}"
      - "-c"
      - "primary_slot_name=${HOLOLIVE_STANDBY_SLOT:-iris_seoul_standby}"
    environment:
      PGDATA: /var/lib/postgresql/pgdata
      PGPORT: "5432"
    volumes:
      - holo-pg-standby-data:/var/lib/postgresql
      - ./postgres/pg_hba.conf:/run/hololive-bot/postgres/pg_hba.conf:ro
      - /etc/stack-secrets/hololive-bot/certs/postgres-ca.pem:/run/hololive-bot/certs/postgres-ca.pem:ro
      - /etc/stack-secrets/hololive-bot/postgres/pgpass:/run/hololive-bot/postgres/pgpass:ro
      - /etc/stack-secrets/hololive-bot/postgres-tls:/run/hololive-bot/postgres-tls:ro
      - /var/lib/hololive-postgres-failover:/run/hololive-bot/postgres-failover:ro
    ports:
      # Keep loopback by default. Automatic routing requires an explicit tailnet bind in
      # ap-compose.env, e.g. HOLOLIVE_STANDBY_POSTGRES_BIND_IP=100.100.1.5.
      - "${HOLOLIVE_STANDBY_POSTGRES_BIND_IP:-127.0.0.1}:${HOLOLIVE_STANDBY_POSTGRES_PORT:-5434}:5432"
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=3775,uid=999,gid=999
    healthcheck:
      # A normal standby must be in recovery and must not carry a promotion signal.
      # A promoted node is healthy only when the dedicated controller wrote its
      # host-side durable signal after pg_promote() completed.
      test:
        - "CMD-SHELL"
        - >-
          role="$$(psql -U postgres_admin -d hololive -p 5432 -Atc 'select pg_is_in_recovery()')" &&
          case "$$role" in
            t) test ! -e /run/hololive-bot/postgres-failover/health.signal ;;
            f) grep -qx 'role=primary' /run/hololive-bot/postgres-failover/health.signal ;;
            *) exit 1 ;;
          esac
      interval: 30s
      timeout: 7s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 256

volumes:
  holo-pg-standby-data:
