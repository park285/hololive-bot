# 비활성 참고 설정이다. 현재 주 서버는 hosts.conf의 central이며
# 남은 Osaka 디스크가 실행·동기화 중인 대기 서버를 뜻하지 않는다.
# 새 대기 서버 준비·HBA·슬롯·장애 전환은 별도 승인이 필요하다.
# 절차: docs/current/runbooks/postgres-replication.md.
#
#   docker compose --env-file /etc/stack-secrets/hololive-bot/ap-compose.env \
#     -f deploy/compose/docker-compose.standby.yml up -d holo-postgres-standby

services:
  holo-postgres-standby:
    # alpine 이미지의 postgres는 uid 70이지만 스택 공통으로 999를 쓴다(TwentyQ·ChatBotGo와 동일).
    # user 지정 시 entrypoint의 root 준비 단계가 빠지므로 소켓 tmpfs에 uid/gid를 직접 준다.
    user: "999:999"
    image: ${POSTGRES_IMAGE:-hololive-postgres:prod}
    container_name: holo-postgres-standby
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    command:
      - postgres
      - "-c"
      - "hba_file=/run/hololive-bot/postgres/pg_hba.conf"
      - "-c"
      - "hot_standby=on"
      - "-c"
      - "hot_standby_feedback=on"
      # primary보다 작으면 standby가 기동을 거부한다. 값은 prod primary와 동일하게 둔다.
      - "-c"
      - "max_connections=61"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "tcp_keepalives_idle=60"
      - "-c"
      - "tcp_keepalives_interval=10"
      - "-c"
      - "tcp_keepalives_count=6"
      - "-c"
      - "checkpoint_timeout=900s"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "wal_compression=lz4"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_temp_files=1MB"
      - "-c"
      - "log_min_duration_statement=1s"
      - "-c"
      - "log_parameter_max_length=0"
      - "-c"
      - "log_parameter_max_length_on_error=0"
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/run/hololive-bot/postgres-tls/server.crt"
      - "-c"
      - "ssl_key_file=/run/hololive-bot/postgres-tls/server.key"
      - "-c"
      - "primary_conninfo=host=${HOLOLIVE_PRIMARY_HOST:?approved primary from deploy/topology/hosts.conf required} port=${HOLOLIVE_PRIMARY_PORT:-5433} user=${HOLOLIVE_REPLICATOR_USER:-hololive_replicator} sslmode=verify-full sslrootcert=/run/hololive-bot/certs/postgres-ca.pem passfile=/run/hololive-bot/postgres/pgpass application_name=${HOLOLIVE_STANDBY_SLOT:-iris_seoul_standby}"
      - "-c"
      - "primary_slot_name=${HOLOLIVE_STANDBY_SLOT:-iris_seoul_standby}"
    environment:
      PGDATA: /var/lib/postgresql/pgdata
      PGPORT: "5432"
    volumes:
      - holo-pg-standby-data:/var/lib/postgresql
      - ./postgres/pg_hba.conf:/run/hololive-bot/postgres/pg_hba.conf:ro
      - /etc/stack-secrets/hololive-bot/certs/postgres-ca.pem:/run/hololive-bot/certs/postgres-ca.pem:ro
      - /etc/stack-secrets/hololive-bot/postgres/pgpass:/run/hololive-bot/postgres/pgpass:ro
      - /etc/stack-secrets/hololive-bot/postgres-tls:/run/hololive-bot/postgres-tls:ro
      - /var/lib/hololive-postgres-failover:/run/hololive-bot/postgres-failover:ro
    ports:
      # 기본값은 loopback이다. 자동 라우팅에는 ap-compose.env에 HOLOLIVE_STANDBY_POSTGRES_BIND_IP를 명시한다.
      - "${HOLOLIVE_STANDBY_POSTGRES_BIND_IP:-127.0.0.1}:${HOLOLIVE_STANDBY_POSTGRES_PORT:-5434}:5432"
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=3775,uid=999,gid=999
    healthcheck:
      # standby는 recovery 상태이며 승격 표시가 없어야 한다.
      # 승격 노드는 전용 제어기가 pg_promote() 완료 뒤 영속 표시를 남겼을 때만 정상이다.
      test:
        - "CMD-SHELL"
        - >-
          role="$$(psql -U postgres_admin -d hololive -p 5432 -Atc 'select pg_is_in_recovery()')" &&
          case "$$role" in
            t) test ! -e /run/hololive-bot/postgres-failover/health.signal ;;
            f) grep -qx 'role=primary' /run/hololive-bot/postgres-failover/health.signal ;;
            *) exit 1 ;;
          esac
      interval: 30s
      timeout: 7s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1g
          pids: 256

volumes:
  holo-pg-standby-data:
