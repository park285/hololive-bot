# 영속 TLS data와 복제 수용 뒤 앱의 discovery만 전환한다.
x-sentinel-env: &sentinel-env
  CACHE_HOST: ""
  CACHE_SOCKET_PATH: ""
  CACHE_SENTINEL_MASTER_SET: hololive
  CACHE_SENTINEL_ADDRS: ${VALKEY_SENTINEL_ADDRS:?VALKEY_SENTINEL_ADDRS must list the three Sentinel TLS endpoints}
  CACHE_SENTINEL_USERNAME: hololive-discovery
  CACHE_SENTINEL_PASSWORD_FILE: /run/hololive-bot/certs/valkey-discovery-password

services:
  hololive-api:
    environment:
      <<: *sentinel-env
  hololive-alarm-worker:
    environment:
      <<: *sentinel-env
