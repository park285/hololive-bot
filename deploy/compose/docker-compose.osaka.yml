x-osaka-ap-db-env: &osaka-ap-db-env
  POSTGRES_SOCKET_PATH: ""
  POSTGRES_HOST: ${HOLOLIVE_CENTRAL_POSTGRES_HOST:?HOLOLIVE_CENTRAL_POSTGRES_HOST is required for an AP overlay}
  POSTGRES_PORT: ${HOLOLIVE_CENTRAL_POSTGRES_PORT:-5433}

x-osaka-ap-logging: &osaka-ap-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "3"

x-osaka-ap-service: &osaka-ap-service
  extends:
    file: docker-compose.collector.yml
    service: youtube-collector
  profiles: ["oracle"]
  env_file:
    - ${HOLOLIVE_YOUTUBE_COLLECTOR_ENV_FILE:-/etc/stack-secrets/hololive-bot/youtube-collector.env}
  volumes: !override
    - ../../data:/app/data
    - ../../logs:/app/logs
    - /etc/stack-secrets/hololive-bot/certs/postgres-ca.pem:/run/hololive-bot/certs/postgres-ca.pem:ro
    - /etc/stack-secrets/hololive-bot/certs/hololive-h3.crt:/run/hololive-bot/certs/hololive-h3.crt:ro
    - /etc/stack-secrets/hololive-bot/certs/hololive-h3.key:/run/hololive-bot/certs/hololive-h3.key:ro
    - type: bind
      source: /etc/stack-secrets/hololive-bot/worker-profiles
      target: /run/hololive-bot/worker-profiles
      read_only: true
      bind:
        create_host_path: false
    - youtube-po-a-socket:/run/hololive-youtube-po:ro
  logging: *osaka-ap-logging
  deploy:
    resources:
      limits:
        memory: 1g

x-osaka-ap-env-common: &osaka-ap-env-common
  <<: *osaka-ap-db-env
  YOUTUBE_COLLECTOR_RUNTIME_ALLOWED: "true"
  POSTGRES_USER: hololive_scraper
  # 상한(1g)은 Go 640MiB에 YouTube.js Node helper(관측 최대 176MiB) 몫 192MiB와 여유 32MiB를 더한 값보다 크게 둔다.
  GOMEMLIMIT: "640MiB"

services:
  youtube-po-a:
    extends:
      file: docker-compose.collector.yml
      service: youtube-po-c
    profiles: ["oracle"]
    container_name: hololive-youtube-po-a
    volumes: !override
      - youtube-po-a-socket:/run/hololive-youtube-po

  youtube-collector-a:
    <<: *osaka-ap-service
    container_name: hololive-youtube-collector-a
    environment:
      <<: *osaka-ap-env-common
      STACK_WORKER_PROFILE_FILE: /run/hololive-bot/worker-profiles/youtube-collector-a.json
      YOUTUBE_COLLECTOR_INSTANCE_ID: "youtube-collector-a"
      PGAPPNAME: youtube-collector-a
      YOUTUBE_COLLECTOR_LOG_FILE_NAME: "youtube-collector-a.log"
      SERVER_PORT: 30005
      HOLOLIVE_H3_ADDR: ":30005"
      PHOTO_SYNC_ENABLED: "false"
    ports: !override
      - "127.0.0.1:30005:30005"
      - "127.0.0.1:30005:30005/udp"
      - "100.100.1.6:30096:30096"
    healthcheck:
      test: ["CMD", "./bin/healthcheck", "https://127.0.0.1:30005/ready"]

networks:
  hololive-net:
    driver: bridge

volumes:
  youtube-po-a-socket:
