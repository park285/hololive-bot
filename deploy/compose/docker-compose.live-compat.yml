# Explicit opt-in overlay for the current live host bindings.
# LIVE_LOGS_PATH: /opt 배포 시 ../../logs가 root 소유 current/logs에 갇히는 문제를 피하기 위한
# 호스트 로그 절대경로. 개인 경로 하드코딩 대신 필수 변수로 강제한다.

x-live-postgres-env: &live-postgres-env
  POSTGRES_HOST: holo-postgres
  POSTGRES_PORT: "5432"
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-verify-full}
  # 라이브 호스트의 runtime-config 마운트 특성상 파일 stat 검사를 건너뛰는 호환 플래그.
  IRIS_BASE_URL_FILE_SKIP_STAT_CHECKS: ${IRIS_BASE_URL_FILE_SKIP_STAT_CHECKS:-true}

services:
  admin-dashboard-ingress:
    image: ${NGINX_IMAGE:-nginx:1.30.4-alpine-slim@sha256:ddde39c6e51f02fde7410c2e9c234cf2d0a4c7bdbbe176aeb37d8ad7ab4eb58c}
    container_name: admin-dashboard-ingress
    user: "101:101"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    labels:
      deunhealth.restart.on.unhealthy: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    network_mode: host
    volumes:
      - ${HOLOLIVE_INGRESS_CONF:-/run/hololive-bot/admin-dashboard-ingress.conf}:/etc/nginx/admin-dashboard-ingress.conf:ro
    command: ["nginx", "-c", "/etc/nginx/admin-dashboard-ingress.conf", "-g", "daemon off;"]
    tmpfs:
      - /tmp:size=16m,mode=1777,uid=101,gid=101
      - /var/cache/nginx:size=16m,mode=0755,uid=101,gid=101
      - /var/run:size=1m,mode=0755,uid=101,gid=101
    depends_on:
      admin-dashboard:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 32m
          pids: 64
    healthcheck:
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
      test: ["CMD-SHELL", "wget -q -O /dev/null -T 3 http://${HOLOLIVE_BOT_PORT_BIND_IP:-100.100.1.3}:30191/health && wget -q -O /dev/null -T 3 http://${HOLOLIVE_BOT_PORT_BIND_IP:-100.100.1.3}:30192/healthz"]

  holo-postgres:
    environment:
      PGPORT: "5432"
    ports:
      - "${POSTGRES_PORT_BIND_IP:-100.100.1.3}:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -p 5432 && psql -U $$POSTGRES_USER -d $$POSTGRES_DB -p 5432 -c 'SELECT 1' -q -t"]

  valkey-cache:
    ports:
      - "${VALKEY_PORT_BIND_IP:-100.100.1.3}:6379:6379"
    # command 오버라이드는 prod의 gid 1000/0660 소켓 정책을 그대로 상속하고 tailnet publish만 남긴다.

  hololive-db-migrate:
    environment:
      PGHOST: holo-postgres
      PGPORT: "5432"

  hololive-api:
    env_file: !override
      - ${HOLOLIVE_API_ENV_FILE:-/etc/stack-secrets/hololive-bot/bot.env}
    environment:
      <<: *live-postgres-env
      IRIS_BASE_URL_FILE: ${IRIS_BASE_URL_FILE:-/app/runtime-config/iris_base_url}
      IRIS_BASE_URL_ALLOWED_HOSTS: ${IRIS_BASE_URL_ALLOWED_HOSTS:-100.100.1.5}
      HEALTHCHECK_SERVER_NAME: ${HOLOLIVE_H3_SERVER_NAME:-100.100.1.3}
      HOLOLIVE_SHORT_LINK_ADDR: ":30101"
    ports: !override
      - "${HOLOLIVE_API_PORT_BIND_IP:-100.100.1.3}:30001:30001"
      - "${HOLOLIVE_API_PORT_BIND_IP:-100.100.1.3}:30001:30001/udp"
      - "127.0.0.1:30101:30101"
      - "127.0.0.1:30003:30003"
      - "127.0.0.1:30003:30003/udp"
      - "127.0.0.1:30006:30006"
      - "127.0.0.1:30006:30006/udp"
      - "${HOLOLIVE_METRICS_PORT_BIND_IP:-127.0.0.1}:30091:30091"
      - "127.0.0.1:30061:30061"
    volumes: !override
      - ../../data:/app/data
      - ${LIVE_LOGS_PATH:?LIVE_LOGS_PATH is required for live-compat overlays}:/app/logs
      - ../../runtime-config:/app/runtime-config:ro
      - /etc/stack-secrets/hololive-bot/certs/hololive-h3.crt:/run/hololive-bot/certs/hololive-h3.crt:ro
      - /etc/stack-secrets/hololive-bot/certs/hololive-h3.key:/run/hololive-bot/certs/hololive-h3.key:ro
      - /etc/stack-secrets/hololive-bot/certs/iris-ca.pem:/run/hololive-bot/certs/iris-ca.pem:ro
      - /etc/stack-secrets/hololive-bot/certs/postgres-ca.pem:/run/hololive-bot/certs/postgres-ca.pem:ro
      - valkey-cache-socket:/var/run/valkey:ro
    networks:
      observability-traces: {}

  hololive-alarm-worker:
    env_file: !override
      - ${HOLOLIVE_ALARM_WORKER_ENV_FILE:-/etc/stack-secrets/hololive-bot/alarm-worker.env}
    ports: !override
      - "127.0.0.1:30007:30007"
      - "127.0.0.1:30007:30007/udp"
      - "${HOLOLIVE_METRICS_PORT_BIND_IP:-127.0.0.1}:30097:30097"
      - "127.0.0.1:30067:30067"
    environment:
      <<: *live-postgres-env
      IRIS_BASE_URL_FILE: ${IRIS_BASE_URL_FILE:-/app/runtime-config/iris_base_url}
      IRIS_BASE_URL_ALLOWED_HOSTS: ${IRIS_BASE_URL_ALLOWED_HOSTS:-100.100.1.5}
    volumes: !override
      - ../../data:/app/data
      - ${LIVE_LOGS_PATH:?LIVE_LOGS_PATH is required for live-compat overlays}:/app/logs
      - ../../runtime-config:/app/runtime-config:ro
      - /etc/stack-secrets/hololive-bot/certs/hololive-h3.crt:/run/hololive-bot/certs/hololive-h3.crt:ro
      - /etc/stack-secrets/hololive-bot/certs/hololive-h3.key:/run/hololive-bot/certs/hololive-h3.key:ro
      - /etc/stack-secrets/hololive-bot/certs/iris-ca.pem:/run/hololive-bot/certs/iris-ca.pem:ro
      - /etc/stack-secrets/hololive-bot/certs/postgres-ca.pem:/run/hololive-bot/certs/postgres-ca.pem:ro
      - valkey-cache-socket:/var/run/valkey:ro
    networks:
      observability-traces: {}

  youtube-producer:
    environment:
      <<: *live-postgres-env
    volumes: !override
      - ../../data:/app/data
      - ${LIVE_LOGS_PATH:?LIVE_LOGS_PATH is required for live-compat overlays}:/app/logs
      - ../../runtime-config:/app/runtime-config:ro
      - /etc/stack-secrets/hololive-bot/certs/hololive-h3.crt:/run/hololive-bot/certs/hololive-h3.crt:ro
      - /etc/stack-secrets/hololive-bot/certs/hololive-h3.key:/run/hololive-bot/certs/hololive-h3.key:ro
      - /etc/stack-secrets/hololive-bot/certs/postgres-ca.pem:/run/hololive-bot/certs/postgres-ca.pem:ro
      - valkey-cache-socket:/var/run/valkey:ro

  admin-dashboard:
    environment:
      ALLOWED_ORIGINS: ${ADMIN_DASHBOARD_ALLOWED_ORIGINS:-https://admin.holoshi.com}
    ports:
      - "${ADMIN_DASHBOARD_PORT_BIND_IP:-127.0.0.1}:30190:30190"
    volumes:
      - ${LIVE_LOGS_PATH:?LIVE_LOGS_PATH is required for live-compat overlays}:/app/logs

networks:
  # 게이트웨이 고정: admin-dashboard TRUSTED_PROXY_CIDRS(172.23.0.1/32)의 전제. down→up 재생성에서
  # 두 네트워크가 대역을 서로 맞바꿔 잡은 사례(2026-07-05)가 있어 둘 다 핀한다. central/main-ap
  # 전용 오버레이라 AP 호스트의 동적 할당에는 영향 없다.
  hololive-net:
    ipam:
      config:
        - subnet: 172.23.0.0/16
          gateway: 172.23.0.1
  docker-proxy-net:
    ipam:
      config:
        - subnet: 172.22.0.0/16
          gateway: 172.22.0.1
  observability-traces:
    external: true
    name: observability-traces
