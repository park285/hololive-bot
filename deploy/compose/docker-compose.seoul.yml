x-seoul-ap-db-env: &seoul-ap-db-env
  POSTGRES_SOCKET_PATH: ""
  POSTGRES_HOST: ${HOLOLIVE_CENTRAL_POSTGRES_HOST:?HOLOLIVE_CENTRAL_POSTGRES_HOST is required for an AP overlay}
  POSTGRES_PORT: ${HOLOLIVE_CENTRAL_POSTGRES_PORT:-5433}

# iris-seoul Alloy는 Docker API 없이 system journal에서 컨테이너 로그를 읽는다(observability-stack alloy/iris-seoul.alloy).
# Docker API 조회(inspect)를 열어 두면 컨테이너 env의 비밀까지 읽히므로 journald 드라이버로 보낸다. 보존은 journald가 맡는다.
x-seoul-ap-logging: &seoul-ap-logging
  driver: "journald"
  options:
    tag: "{{.Name}}"

services:
  youtube-po-b:
    extends:
      file: docker-compose.collector.yml
      service: youtube-po-c
    profiles: ["oracle"]
    container_name: hololive-youtube-po-b
    volumes: !override
      - youtube-po-b-socket:/run/hololive-youtube-po
    logging: *seoul-ap-logging

  youtube-collector-b:
    extends:
      file: docker-compose.collector.yml
      service: youtube-collector
    profiles: ["oracle"]
    build:
      provenance: false
      sbom: false
    container_name: hololive-youtube-collector-b
    env_file:
      - ${HOLOLIVE_YOUTUBE_COLLECTOR_ENV_FILE:-/etc/stack-secrets/hololive-bot/youtube-collector.env}
    environment:
      <<: *seoul-ap-db-env
      STACK_WORKER_PROFILE_FILE: /run/hololive-bot/worker-profiles/youtube-collector-b.json
      YOUTUBE_COLLECTOR_RUNTIME_ALLOWED: "true"
      POSTGRES_USER: hololive_scraper
      # 상한(1g)은 Go 640MiB에 YouTube.js Node helper(관측 최대 176MiB) 몫 192MiB와 여유 32MiB를 더한 값보다 크게 둔다.
      GOMEMLIMIT: "640MiB"
      YOUTUBE_COLLECTOR_INSTANCE_ID: "youtube-collector-b"
      PGAPPNAME: youtube-collector-b
      YOUTUBE_COLLECTOR_LOG_FILE_NAME: "youtube-collector-b.log"
      SERVER_PORT: 30015
      HOLOLIVE_H3_ADDR: ":30015"
      PHOTO_SYNC_ENABLED: "false"
    ports: !override
      - "127.0.0.1:30015:30015"
      - "127.0.0.1:30015:30015/udp"
      - "100.100.1.5:30096:30096"
    volumes: !override
      - ../../data:/app/data
      - ../../logs:/app/logs
      - /etc/stack-secrets/hololive-bot/certs/postgres-ca.pem:/run/hololive-bot/certs/postgres-ca.pem:ro
      - /etc/stack-secrets/hololive-bot/certs/hololive-h3.crt:/run/hololive-bot/certs/hololive-h3.crt:ro
      - /etc/stack-secrets/hololive-bot/certs/hololive-h3.key:/run/hololive-bot/certs/hololive-h3.key:ro
      - type: bind
        source: /etc/stack-secrets/hololive-bot/worker-profiles
        target: /run/hololive-bot/worker-profiles
        read_only: true
        bind:
          create_host_path: false
      - youtube-po-b-socket:/run/hololive-youtube-po:ro
    healthcheck:
      test: ["CMD", "./bin/healthcheck", "https://127.0.0.1:30015/ready"]
    logging: *seoul-ap-logging
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  youtube-po-b-socket:

networks:
  hololive-net:
    driver: bridge
