# 중앙 영속 TLS 경로다. 복제 수용 뒤 별도 Sentinel overlay로 앱 discovery만 전환한다.
x-valkey-env: &valkey-env
  CACHE_HOST: ${VALKEY_BIND_IP:?VALKEY_BIND_IP must be the central tailnet address}
  CACHE_PORT: "16379"
  CACHE_SOCKET_PATH: ""
  CACHE_PASSWORD: ""
  CACHE_SENTINEL_MASTER_SET: ""
  CACHE_SENTINEL_ADDRS: ""
  CACHE_SENTINEL_USERNAME: ""
  CACHE_SENTINEL_PASSWORD_FILE: ""
  CACHE_TLS_CA_FILE: /run/hololive-bot/certs/iris-ca.pem

services:
  valkey-cache:
    image: ${VALKEY_IMAGE:-iris-stack-valkey:9.1.3-zlib1.3.2-r2}
    environment: !reset {}
    command: [valkey-runtime, server, /run/valkey/server.conf, /data/valkey.conf]
    ports: !override
      - "${VALKEY_BIND_IP:?VALKEY_BIND_IP must be the central tailnet address}:16379:16379"
    cap_add: !reset []
    volumes: !override
      - valkey-ha-data:/data
      - type: bind
        source: /etc/stack-secrets/valkey/hololive
        target: /run/valkey
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/stack-secrets/valkey/certs
        target: /run/valkey-certs
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, valkey-runtime, health, /run/valkey/health-password, /run/valkey-certs/ca.pem, "16379"]

  hololive-api:
    environment:
      <<: *valkey-env
      CACHE_USERNAME: hololive-api
      CACHE_PASSWORD_FILE: /run/hololive-bot/certs/valkey-api-password
    volumes: !override
      - ../../data:/app/data
      - ${LIVE_LOGS_PATH:-../../logs}:/app/logs
      - ../../runtime-config:/app/runtime-config:ro
      - /etc/stack-secrets/hololive-bot/certs/hololive-h3.crt:/run/hololive-bot/certs/hololive-h3.crt:ro
      - /etc/stack-secrets/hololive-bot/certs/hololive-h3.key:/run/hololive-bot/certs/hololive-h3.key:ro
      - /etc/stack-secrets/hololive-bot/certs/iris-ca.pem:/run/hololive-bot/certs/iris-ca.pem:ro
      - /etc/stack-secrets/hololive-bot/certs/postgres-ca.pem:/run/hololive-bot/certs/postgres-ca.pem:ro
      - type: bind
        source: /etc/stack-secrets/hololive-bot/worker-profiles
        target: /run/hololive-bot/worker-profiles
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/stack-secrets/hololive-bot/certs/valkey-api-password
        target: /run/hololive-bot/certs/valkey-api-password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/stack-secrets/hololive-bot/certs/valkey-discovery-password
        target: /run/hololive-bot/certs/valkey-discovery-password
        read_only: true
        bind: {create_host_path: false}

  hololive-alarm-worker:
    environment:
      <<: *valkey-env
      CACHE_USERNAME: hololive-worker
      CACHE_PASSWORD_FILE: /run/hololive-bot/certs/valkey-worker-password
    volumes: !override
      - ../../data:/app/data
      - ${LIVE_LOGS_PATH:-../../logs}:/app/logs
      - ../../runtime-config:/app/runtime-config:ro
      - /etc/stack-secrets/hololive-bot/certs/hololive-h3.crt:/run/hololive-bot/certs/hololive-h3.crt:ro
      - /etc/stack-secrets/hololive-bot/certs/hololive-h3.key:/run/hololive-bot/certs/hololive-h3.key:ro
      - /etc/stack-secrets/hololive-bot/certs/iris-ca.pem:/run/hololive-bot/certs/iris-ca.pem:ro
      - /etc/stack-secrets/hololive-bot/certs/postgres-ca.pem:/run/hololive-bot/certs/postgres-ca.pem:ro
      - type: bind
        source: /etc/stack-secrets/hololive-bot/worker-profiles
        target: /run/hololive-bot/worker-profiles
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/stack-secrets/hololive-bot/certs/valkey-worker-password
        target: /run/hololive-bot/certs/valkey-worker-password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /etc/stack-secrets/hololive-bot/certs/valkey-discovery-password
        target: /run/hololive-bot/certs/valkey-discovery-password
        read_only: true
        bind: {create_host_path: false}

volumes:
  valkey-ha-data:
