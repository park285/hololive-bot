x-osaka2-ap-env: &osaka2-ap-env
  CACHE_SOCKET_PATH: ""
  CACHE_HOST: ${HOLOLIVE_CENTRAL_CACHE_HOST:?HOLOLIVE_CENTRAL_CACHE_HOST is required for an AP overlay}
  CACHE_PORT: ${HOLOLIVE_CENTRAL_CACHE_PORT:-6379}
  POSTGRES_SOCKET_PATH: ""
  POSTGRES_HOST: ${HOLOLIVE_CENTRAL_POSTGRES_HOST:?HOLOLIVE_CENTRAL_POSTGRES_HOST is required for an AP overlay}
  POSTGRES_PORT: ${HOLOLIVE_CENTRAL_POSTGRES_PORT:-5433}
  # SCRAPER_BACKFILL_*: prod x-scraper-env 기본값을 extends/파일 병합으로 그대로 상속하므로 재선언하지 않는다.

x-osaka2-ap-logging: &osaka2-ap-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "3"

services:
  hololive-api:
    profiles: !override ["central-only"]
    env_file: !override []

  hololive-alarm-worker:
    profiles: !override ["central-only"]
    env_file: !override []

  admin-dashboard:
    profiles: !override ["central-only"]

  docker-proxy:
    profiles: !override ["central-only"]

  deunhealth:
    profiles: !override ["central-only"]

  youtube-producer:
    profiles: !override ["retired-youtube-producer"]
    env_file: !override
      - ${HOLOLIVE_YOUTUBE_PRODUCER_ENV_FILE:-/etc/stack-secrets/hololive-bot/youtube-producer.env}
    environment:
      <<: *osaka2-ap-env
      YOUTUBE_PRODUCER_RUNTIME_ALLOWED: "true"
    volumes: !override
      - ../../data:/app/data
      - ../../logs:/app/logs
      - ../../runtime-config:/app/runtime-config:ro
      - /etc/stack-secrets/hololive-bot/certs/iris-ca.pem:/run/hololive-bot/certs/iris-ca.pem:ro
      - /etc/stack-secrets/hololive-bot/certs/postgres-ca.pem:/run/hololive-bot/certs/postgres-ca.pem:ro
    logging: *osaka2-ap-logging
    deploy:
      resources:
        limits:
          memory: 768m

  youtube-producer-d:
    extends:
      file: docker-compose.prod.yml
      service: youtube-producer
    profiles: ["oracle"]
    build:
      provenance: false
      sbom: false
    container_name: hololive-youtube-producer-d
    env_file:
      - ${HOLOLIVE_YOUTUBE_PRODUCER_ENV_FILE:-/etc/stack-secrets/hololive-bot/youtube-producer.env}
    environment:
      <<: *osaka2-ap-env
      YOUTUBE_PRODUCER_RUNTIME_ALLOWED: "true"
      YOUTUBE_PRODUCER_ACTIVE_ACTIVE_ENABLED: "true"
      YOUTUBE_PRODUCER_ACTIVE_ACTIVE_INSTANCE_COUNT: "4"
      YOUTUBE_PRODUCER_LEASE_NAMESPACE: ${YOUTUBE_PRODUCER_LEASE_NAMESPACE:-production}
      SCRAPER_FETCHER_ENGINE: ${YOUTUBE_PRODUCER_D_FETCHER_ENGINE:-nethttp}
      SCRAPER_SCHEDULER_WORKER_COUNT: ${YOUTUBE_PRODUCER_AP_WORKER_COUNT:-2}
      GOMEMLIMIT: "640MiB"
      YOUTUBE_PRODUCER_INSTANCE_ID: "youtube-producer-d"
      YOUTUBE_PRODUCER_LOG_FILE_NAME: "youtube-producer-d.log"
      SERVER_PORT: 30035
      HOLOLIVE_H3_ADDR: ":30035"
      PHOTO_SYNC_ENABLED: "false"
    ports: !override
      - "127.0.0.1:30035:30035"
      - "127.0.0.1:30035:30035/udp"
      - "100.100.1.2:30095:30095"
    healthcheck:
      test: ["CMD", "./bin/healthcheck", "https://127.0.0.1:30035/health"]
    volumes: !override
      - ../../data:/app/data
      - ../../logs:/app/logs
      - ../../runtime-config:/app/runtime-config:ro
      - /etc/stack-secrets/hololive-bot/certs/iris-ca.pem:/run/hololive-bot/certs/iris-ca.pem:ro
      - /etc/stack-secrets/hololive-bot/certs/postgres-ca.pem:/run/hololive-bot/certs/postgres-ca.pem:ro
      - /etc/stack-secrets/hololive-bot/certs/hololive-h3.crt:/run/hololive-bot/certs/hololive-h3.crt:ro
      - /etc/stack-secrets/hololive-bot/certs/hololive-h3.key:/run/hololive-bot/certs/hololive-h3.key:ro
    logging: *osaka2-ap-logging
    deploy:
      resources:
        limits:
          memory: 768m
