# Repository-owned PostgreSQL authentication; mounted via hba_file.
# Only postgres and the central migration job mount the privileged Unix socket.
# docker exec operator/health/nightly sessions retain the local socket contract.
local   all             all                                     trust
local   replication     all                                     trust

# Reject privileged SQL and physical-replication TCP before any source allow.
# DATABASE=all does not match physical replication: both rows are necessary.
host    all             postgres_admin,hololive_migrator         all reject
host    replication     postgres_admin,hololive_migrator         all reject
host    all             iris_db_nightly                          all reject

# No active standby: replication TCP has no allow rule. Reactivation requires
# a separately approved explicit TLS transport/address rule before this reject.
host    replication     all                  all                reject
host    all             hololive_replicator  all                reject

# Source NAT may present any AP as the Docker gateway; roles, not that source,
# form the boundary. Runtime/scraper/exporter retain TLS-only login.
hostssl hololive        hololive_runtime,hololive_scraper 172.16.0.0/12 scram-sha-256
hostssl all             postgres_exporter    172.16.0.0/12     scram-sha-256
hostssl hololive        hololive_scraper     100.100.1.2/32     scram-sha-256
hostssl all             postgres_exporter    100.100.1.3/32     scram-sha-256
hostssl hololive        hololive_scraper     100.100.1.5/32     scram-sha-256
hostssl hololive        hololive_scraper     100.100.1.6/32     scram-sha-256
hostssl hololive        hololive_runtime,hololive_scraper 100.100.1.8/32 scram-sha-256
hostssl all             postgres_exporter    100.100.1.8/32     scram-sha-256
host    all             all                  all                reject
