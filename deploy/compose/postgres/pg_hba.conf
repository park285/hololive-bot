# hololive PostgreSQL client authentication.
#
# 이 파일이 유일한 소유자다. compose 의 `-c hba_file=` 이 PGDATA 안의 사본 대신 이 파일을
# 가리키므로, 볼륨을 다시 만들어도 스트리밍 복제 규칙이 조용히 사라지지 않는다.
#
# TYPE  DATABASE        USER                 ADDRESS            METHOD

# 컨테이너 로컬 — healthcheck 과 docker exec psql 이 의존한다.
local   all             all                                     trust
host    all             all                  127.0.0.1/32       trust
host    all             all                  ::1/128            trust
local   replication     all                                     trust
host    replication     all                  127.0.0.1/32       trust
host    replication     all                  ::1/128            trust

# iris-seoul hot standby. `host all all all` 은 replication 유사 데이터베이스를 매치하지
# 않으므로 이 줄이 없으면 원격 standby 가 붙지 못한다.
hostssl replication     hololive_replicator  100.100.1.5/32     scram-sha-256

# 로컬 Docker runtime과 exporter. Docker bridge 주소 공간으로 source를 제한하고 TLS를 강제한다.
hostssl all             all                  172.16.0.0/12      scram-sha-256

# 승인된 tailnet 클라이언트(collector AP·중앙/standby host·exporter).
hostssl all             all                  100.100.1.2/32     scram-sha-256
hostssl all             all                  100.100.1.3/32     scram-sha-256
hostssl all             all                  100.100.1.5/32     scram-sha-256
hostssl all             all                  100.100.1.6/32     scram-sha-256
hostssl all             all                  100.100.1.8/32     scram-sha-256
