# compose.env의 HOLOLIVE_SCHEDULE_POSTER_ENABLED=1일 때만 설치 도구가 함께 설치한다.
# 대상·Vertex 설정 파일과 Vertex 서비스 계정(ADC)을 준비한 배포에서만 적용한다.
[Container]
Environment=SCHEDULE_POSTER_CONFIG_FILE=/run/hololive-bot/schedule-poster/config.json
Environment=GOOGLE_APPLICATION_CREDENTIALS=/run/hololive-bot/vertex/adc.json
# 두 파일 모두 실행 UID(1000) 전용 0600이라 :idmap으로 on-disk 소유자를 그대로 본다(unit은 UserNS=auto).
Volume=/etc/stack-secrets/hololive-bot/schedule-poster/config.json:/run/hololive-bot/schedule-poster/config.json:ro,idmap
Volume=/etc/stack-secrets/hololive-bot/vertex/adc.json:/run/hololive-bot/vertex/adc.json:ro,idmap
