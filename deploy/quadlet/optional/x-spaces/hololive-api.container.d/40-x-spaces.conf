# compose.env의 HOLOLIVE_X_SPACES_ENABLED=1일 때만 설치 도구가 함께 설치한다.
# 세션 암호화 키를 준비한 배포에서만 적용한다.
[Container]
Environment=X_SPACES_KEY_FILE=/run/hololive-bot/x-spaces/key
# key는 실행 UID(1000) 전용 0600이라 :idmap으로 on-disk 소유자를 그대로 본다(unit은 UserNS=auto).
Volume=/etc/stack-secrets/hololive-bot/x-spaces/key:/run/hololive-bot/x-spaces/key:ro,idmap
