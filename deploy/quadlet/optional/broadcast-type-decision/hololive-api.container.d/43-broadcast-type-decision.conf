# compose.env의 HOLOLIVE_BROADCAST_TYPE_DECISION_ENABLED=1일 때만 설치 도구가 함께 설치한다.
# 미분류 방송 유형 판정(Gemini Decisions API)은 일정 포스터 자동 검토와 같은 Gemini API 키 파일을 쓴다.
# 파일이 없으면 컨테이너가 시작하지 않는다. 키를 먼저 등록한 뒤 켠다.
[Container]
Environment=BROADCAST_TYPE_GEMINI_API_KEY_FILE=/run/hololive-bot/broadcast-type/gemini-api-key
# 42-schedule-poster-review.conf와 함께 켜도 mount 대상이 겹치지 않도록 다른 경로에 mount한다.
# 실행 UID(1000) 전용 0600 파일이라 :idmap으로 on-disk 소유자를 그대로 본다(unit은 UserNS=auto).
Volume=/etc/stack-secrets/hololive-bot/gemini/api-key:/run/hololive-bot/broadcast-type/gemini-api-key:ro,idmap
