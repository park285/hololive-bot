# compose.env의 HOLOLIVE_SCHEDULE_POSTER_REVIEW_ENABLED=1일 때만 설치 도구가 함께 설치한다.
# 일정 포스터 후보 자동 검토(Gemini Developer API)의 API 키 파일을 stack-secrets에 등록한 배포에서만 켠다.
# 파일이 없으면 컨테이너가 시작하지 않는다. 키 없이 쓰려면 이 기능을 끈다(그러면 모든 후보를 관리자가 검토한다).
[Container]
Environment=SCHEDULE_POSTER_GEMINI_API_KEY_FILE=/run/hololive-bot/gemini/api-key
# 실행 UID(1000) 전용 0600 파일이라 :idmap으로 on-disk 소유자를 그대로 본다(unit은 UserNS=auto).
Volume=/etc/stack-secrets/hololive-bot/gemini/api-key:/run/hololive-bot/gemini/api-key:ro,idmap
