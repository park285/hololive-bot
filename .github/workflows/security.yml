name: security

# PR 외 이벤트의 보안 검사다. 전체 검증은 scripts/ci/pre-push-gate.sh가 맡는다.
on:
  push:
    branches: [main]
  schedule:
    - cron: "19 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOCACHE: /tmp/go-cache
  GOTMPDIR: /tmp
  GOVULNCHECK_VERSION: v1.8.0
  GOSEC_VERSION: v2.29.0
  NILAWAY_VERSION: v0.0.0-20260918162853-acb8859b9031

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: hololive-bot
    steps:
      - name: Checkout hololive-bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hololive-bot
          persist-credentials: false

      - name: Checkout shared-go
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: park285/shared-go
          ref: 68c3f5be73a9b79731d40459737274e06535f40d # v2.9.3
          path: shared-go
          persist-credentials: false

      - name: Checkout iris-client-go
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: park285/iris-client-go
          ref: b7ddbfb8af464300dae74229bd485643fd04549e # v3.0.4
          path: iris-client-go
          persist-credentials: false

      - name: Python runtime
        uses: ./hololive-bot/.github/actions/python-runtime
        with:
          working-directory: hololive-bot

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: hololive-bot/go.mod
          cache-dependency-path: |
            hololive-bot/go.work.sum
            hololive-bot/go.sum
            hololive-bot/hololive/*/go.sum
            shared-go/go.sum
            iris-client-go/go.sum

      - name: Install security tools
        run: |
          export GOBIN="${RUNNER_TEMP}/go-tools"
          mkdir -p "${GOBIN}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
          nilaway_bin="$(bash scripts/ci/nilaway-models/build.sh)"
          printf 'NILAWAY_BIN=%s\n' "${nilaway_bin}" >> "${GITHUB_ENV}"
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      - name: Resolve workspace package patterns
        run: |
          source scripts/ci/go-workspace-modules.sh
          patterns="$(go_workspace_package_patterns | sed 's#^\./\.\./#../#' | tr '\n' ' ')"
          patterns="./... ${patterns}"
          echo "GO_PKG_PATTERNS=${patterns}" >> "${GITHUB_ENV}"
          echo "resolved patterns: ${patterns}"

      - name: gosec
        run: |
          read -ra pkgs <<< "${GO_PKG_PATTERNS}"
          owned_pkgs=()
          for pkg in "${pkgs[@]}"; do
            case "${pkg}" in
              ../shared-go/...|../iris-client-go/...)
                continue
                ;;
            esac
            owned_pkgs+=("${pkg}")
          done
          gosec -quiet -fmt text "${owned_pkgs[@]}"

      - name: NilAway
        env:
          GOMEMLIMIT: 5GiB
          GOMAXPROCS: "2"
        run: |
          read -ra pkgs <<< "${GO_PKG_PATTERNS}"
          owned_pkgs=()
          for pkg in "${pkgs[@]}"; do
            case "${pkg}" in
              ../shared-go/...|../iris-client-go/...)
                continue
                ;;
            esac
            owned_pkgs+=("${pkg}")
          done
          # 로컬과 같은 unitchecker로 의존성 분석을 재사용하고 동시 메모리 사용을 제한한다.
          go vet -p 1 -vettool="${NILAWAY_BIN}" -pretty-print \
            -include-errors-in-files="${PWD}" "${owned_pkgs[@]}"

      - name: govulncheck
        run: |
          mapfile -t modules < <(go work edit -json | "$CI_PYTHON_BIN" -c 'import json, sys; print("\n".join(use["DiskPath"] for use in json.load(sys.stdin)["Use"]))')
          for module in "${modules[@]}"; do
            echo "govulncheck ${module}"
            (cd "${module}" && govulncheck ./...)
          done

      - name: Docker Compose
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: ./hololive-bot/.github/actions/docker-compose

      - name: Install exact Trivy
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TRIVY_VERSION: "0.75.0"
          TRIVY_LINUX_AMD64_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          archive="${RUNNER_TEMP}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          extract_dir="${RUNNER_TEMP}/trivy-extract"
          bin_dir="${RUNNER_TEMP}/trivy-bin"
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "${archive}" "${url}"
          printf '%s  %s\n' "${TRIVY_LINUX_AMD64_SHA256}" "${archive}" | sha256sum --check -
          mkdir -p "${extract_dir}" "${bin_dir}"
          tar -xzf "${archive}" -C "${extract_dir}" trivy
          install -m 0755 "${extract_dir}/trivy" "${bin_dir}/trivy"
          echo "${bin_dir}" >>"${GITHUB_PATH}"

      - name: Build final production images
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          DOCKER_DEFAULT_PLATFORM: linux/arm64
        run: |
          bash scripts/ci/test-infra-images.sh
          ./build-all.sh --no-bump --build-only --security-scan --skip-local-ci

      - name: Scan every final production image
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash scripts/ci/run-final-image-scan.sh

  npm-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: hololive-bot
    steps:
      - name: Checkout hololive-bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hololive-bot
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: |
            hololive-bot/hololive/hololive-youtube-collector/youtubejs/package-lock.json

      - name: Python runtime
        uses: ./hololive-bot/.github/actions/python-runtime
        with:
          working-directory: hololive-bot

      - name: Docker Compose
        uses: ./hololive-bot/.github/actions/docker-compose

      - name: Validate recurring scan inventory
        run: bash scripts/ci/check-recurring-security-scan-contract.sh

      - name: Audit all npm lockfiles
        run: bash scripts/ci/run-npm-audit.sh
