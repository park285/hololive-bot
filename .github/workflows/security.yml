name: security

on:
  push:
    branches: [main]
  schedule:
    - cron: "19 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOCACHE: /tmp/go-cache
  GOTMPDIR: /tmp
  GOSEC_VERSION: v2.30.0

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: hololive-bot
    steps:
      - name: Checkout hololive-bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: hololive-bot
          persist-credentials: false

      - name: Checkout shared-go at postgres/v1.0.3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: park285/shared-go
          ref: e47dac354d493c2a633f52048188c0f5911b8810
          path: shared-go
          persist-credentials: false

      - name: Checkout iris-client-go
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: park285/iris-client-go
          ref: f46d4fc35e92aea675433e43fd1fcea2fd8136b8
          path: iris-client-go
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: hololive-bot/go.work
          cache-dependency-path: |
            hololive-bot/go.work.sum
            hololive-bot/hololive/*/go.sum
            shared-go/**/go.sum
            iris-client-go/go.sum

      - name: Load checksummed Valkey adapter into the security workspace
        working-directory: hololive-bot/hololive/hololive-api
        env:
          GOWORK: "off"
          GOPROXY: https://proxy.golang.org
          GOMODCACHE: ${{ runner.temp }}/valkey-adapter-modcache
        run: |
          module=github.com/park285/iris-client-go/adapters/valkeydedup
          src="$(go mod download -json "${module}" | jq -er '.Dir')"
          git diff --exit-code -- go.mod go.sum
          dest="${GITHUB_WORKSPACE}/iris-client-go/adapters/valkeydedup"
          test ! -e "${dest}"
          mkdir -p "$(dirname "${dest}")"
          cp -RT "${src}" "${dest}"

      - name: Install security tools
        run: |
          export GOBIN="${RUNNER_TEMP}/go-tools"
          mkdir -p "${GOBIN}"
          source scripts/ci/go-tooling.sh
          govulncheck_bin="$(ensure_govulncheck)"
          printf 'GOVULNCHECK_BIN=%s\n' "${govulncheck_bin}" >> "${GITHUB_ENV}"
          go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
          nilaway_bin="$(bash scripts/ci/nilaway-models/build.sh)"
          printf 'NILAWAY_BIN=%s\n' "${nilaway_bin}" >> "${GITHUB_ENV}"
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      - name: Resolve workspace package patterns
        run: |
          source scripts/ci/go-workspace-modules.sh
          owned_pkgs=()
          for module in "${GO_OWNED_MODULES[@]}"; do
            owned_pkgs+=("./${module}/...")
          done
          printf 'GO_PKG_PATTERNS=%s\n' "${owned_pkgs[*]}" >> "${GITHUB_ENV}"

      - name: gosec
        run: |
          read -ra pkgs <<< "${GO_PKG_PATTERNS}"
          gosec -quiet -fmt text "${pkgs[@]}"

      - name: NilAway
        env:
          GOMEMLIMIT: 5GiB
          GOMAXPROCS: "2"
        run: |
          read -ra pkgs <<< "${GO_PKG_PATTERNS}"
          go vet -p 1 -vettool="${NILAWAY_BIN}" -pretty-print \
            -include-errors-in-files="${PWD}" "${pkgs[@]}"

      - name: govulncheck
        run: |
          mapfile -t modules < <(go work edit -json | jq -r '.Use[].DiskPath')
          for module in "${modules[@]}"; do
            echo "govulncheck ${module}"
            (cd "${module}" && "${GOVULNCHECK_BIN}" ./...)
          done

      - name: Install exact Trivy
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          source scripts/ci/final-image-scan-policy.sh
          archive="${RUNNER_TEMP}/trivy_${FINAL_IMAGE_TRIVY_VERSION}_Linux-64bit.tar.gz"
          extract_dir="${RUNNER_TEMP}/trivy-extract"
          bin_dir="${RUNNER_TEMP}/trivy-bin"
          url="https://github.com/aquasecurity/trivy/releases/download/v${FINAL_IMAGE_TRIVY_VERSION}/trivy_${FINAL_IMAGE_TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "${archive}" "${url}"
          printf '%s  %s\n' "${FINAL_IMAGE_TRIVY_LINUX_AMD64_SHA256}" "${archive}" | sha256sum --check -
          mkdir -p "${extract_dir}" "${bin_dir}"
          tar -xzf "${archive}" -C "${extract_dir}" trivy
          install -m 0755 "${extract_dir}/trivy" "${bin_dir}/trivy"
          echo "${bin_dir}" >>"${GITHUB_PATH}"

      - name: Register arm64 emulation
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: docker run --rm --privileged tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install arm64

      - name: Build final production images
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          HOLOLIVE_BUILD_PLATFORM: linux/arm64
        run: |
          bash scripts/ci/test-infra-images.sh
          ./build-all.sh --no-bump --build-only --skip-local-ci

      - name: Start rootless Podman API for Trivy
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p "${XDG_RUNTIME_DIR}/podman"
          nohup podman system service --time=0 "unix://${XDG_RUNTIME_DIR}/podman/podman.sock" >/dev/null 2>&1 &

      - name: Scan every final production image
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash scripts/ci/run-final-image-scan.sh

  npm-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: hololive-bot
    steps:
      - name: Checkout hololive-bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: hololive-bot
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: |
            hololive-bot/hololive/hololive-youtube-collector/youtubejs/package-lock.json

      - name: Validate recurring scan inventory
        run: bash scripts/ci/check-recurring-security-scan-contract.sh

      - name: Audit all npm lockfiles
        run: bash scripts/ci/run-npm-audit.sh
