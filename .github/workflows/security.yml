name: security

# Non-PR security scan. Heavy full verification stays in scripts/ci/pre-push-gate.sh.
on:
  push:
    branches: [main]
  schedule:
    - cron: "19 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOCACHE: /tmp/go-cache
  GOTMPDIR: /tmp
  GOVULNCHECK_VERSION: v1.7.0
  GOSEC_VERSION: v2.27.1
  NILAWAY_VERSION: v0.0.0-20260808063849-8649a03c818a

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: hololive-bot
    steps:
      - name: Checkout hololive-bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hololive-bot
          persist-credentials: false

      - name: Checkout shared-go
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: park285/shared-go
          ref: 14d793af4cc0f56c416e4be996621e9d63a94764 # v2.2.0
          path: shared-go
          persist-credentials: false

      - name: Checkout iris-client-go
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: park285/iris-client-go
          ref: a83f4d976b7d26ad07f2114aacd293b6fd81f44d # v2.4.0
          path: iris-client-go
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: hololive-bot/.python-version

      - name: Install uv
        run: python -m pip install --disable-pip-version-check --no-cache-dir --no-deps uv==0.12.7

      - name: Initialize Python runtime
        run: |
          interpreter="$(bash scripts/ci/python-runner.sh --print-interpreter)"
          printf 'CI_PYTHON_BIN=%s\n' "$interpreter" >>"$GITHUB_ENV"
          printf 'CI_PYTHON_RUNTIME_ROOT=%s\n' "$GITHUB_WORKSPACE/hololive-bot" >>"$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: hololive-bot/go.mod
          cache-dependency-path: |
            hololive-bot/go.work.sum
            hololive-bot/go.sum
            hololive-bot/admin-dashboard/backend/go.sum
            hololive-bot/hololive/*/go.sum
            shared-go/go.sum
            iris-client-go/go.sum

      - name: Install security tools
        run: |
          export GOBIN="${RUNNER_TEMP}/go-tools"
          mkdir -p "${GOBIN}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"
          go install "go.uber.org/nilaway/cmd/nilaway@${NILAWAY_VERSION}"
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      - name: Resolve workspace package patterns
        run: |
          source scripts/ci/go-workspace-modules.sh
          patterns="$(go_workspace_package_patterns | sed 's#^\./\.\./#../#' | tr '\n' ' ')"
          patterns="./... ${patterns}"
          echo "GO_PKG_PATTERNS=${patterns}" >> "${GITHUB_ENV}"
          echo "resolved patterns: ${patterns}"

      - name: gosec
        run: |
          read -ra pkgs <<< "${GO_PKG_PATTERNS}"
          owned_pkgs=()
          for pkg in "${pkgs[@]}"; do
            case "${pkg}" in
              ../shared-go/...|../iris-client-go/...)
                continue
                ;;
            esac
            owned_pkgs+=("${pkg}")
          done
          gosec -quiet -fmt text "${owned_pkgs[@]}"

      - name: NilAway
        env:
          GOMEMLIMIT: 5GiB
          GOMAXPROCS: "2"
        run: |
          read -ra pkgs <<< "${GO_PKG_PATTERNS}"
          owned_pkgs=()
          for pkg in "${pkgs[@]}"; do
            case "${pkg}" in
              ../shared-go/...|../iris-client-go/...)
                continue
                ;;
            esac
            owned_pkgs+=("${pkg}")
          done
          for pkg in "${owned_pkgs[@]}"; do
            echo "nilaway ${pkg}"
            nilaway -pretty-print "${pkg}"
          done

      - name: govulncheck
        run: |
          mapfile -t modules < <(go work edit -json | "$CI_PYTHON_BIN" -c 'import json, sys; print("\n".join(use["DiskPath"] for use in json.load(sys.stdin)["Use"]))')
          for module in "${modules[@]}"; do
            echo "govulncheck ${module}"
            (cd "${module}" && govulncheck ./...)
          done

      - name: Install exact Docker Compose
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          DOCKER_COMPOSE_VERSION: v2.39.4
          DOCKER_COMPOSE_LINUX_X86_64_SHA256: 7af95166a730b87e172d4fc9aefea8725d3c6c7327d59149267b452114ddb7d4
        run: |
          compose_dir="${HOME}/.docker/cli-plugins"
          compose_bin="${compose_dir}/docker-compose"
          download="${RUNNER_TEMP}/docker-compose-linux-x86_64"
          mkdir -p "${compose_dir}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/docker/compose/releases/download/${DOCKER_COMPOSE_VERSION}/docker-compose-linux-x86_64" \
            --output "${download}"
          printf '%s  %s\n' "${DOCKER_COMPOSE_LINUX_X86_64_SHA256}" "${download}" | sha256sum --check -
          install -m 0755 "${download}" "${compose_bin}"
          test "$(docker compose version --short)" = "${DOCKER_COMPOSE_VERSION#v}"

      - name: Install exact Trivy
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TRIVY_VERSION: "0.74.0"
          TRIVY_LINUX_AMD64_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          archive="${RUNNER_TEMP}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          extract_dir="${RUNNER_TEMP}/trivy-extract"
          bin_dir="${RUNNER_TEMP}/trivy-bin"
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "${archive}" "${url}"
          printf '%s  %s\n' "${TRIVY_LINUX_AMD64_SHA256}" "${archive}" | sha256sum --check -
          mkdir -p "${extract_dir}" "${bin_dir}"
          tar -xzf "${archive}" -C "${extract_dir}" trivy
          install -m 0755 "${extract_dir}/trivy" "${bin_dir}/trivy"
          echo "${bin_dir}" >>"${GITHUB_PATH}"

      - name: Build final production images
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          DOCKER_DEFAULT_PLATFORM: linux/arm64
        run: ./build-all.sh --no-bump --build-only --security-scan --skip-local-ci

      - name: Scan every final production image
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash scripts/ci/run-final-image-scan.sh

  npm-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: hololive-bot
    steps:
      - name: Checkout hololive-bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hololive-bot
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            hololive-bot/admin-dashboard/frontend/package-lock.json
            hololive-bot/hololive/hololive-youtube-collector/youtubejs/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: hololive-bot/.python-version

      - name: Install uv
        run: python -m pip install --disable-pip-version-check --no-cache-dir --no-deps uv==0.12.7

      - name: Install exact Docker Compose
        env:
          DOCKER_COMPOSE_VERSION: v2.39.4
          DOCKER_COMPOSE_LINUX_X86_64_SHA256: 7af95166a730b87e172d4fc9aefea8725d3c6c7327d59149267b452114ddb7d4
        run: |
          compose_dir="${HOME}/.docker/cli-plugins"
          compose_bin="${compose_dir}/docker-compose"
          download="${RUNNER_TEMP}/docker-compose-linux-x86_64"
          mkdir -p "${compose_dir}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/docker/compose/releases/download/${DOCKER_COMPOSE_VERSION}/docker-compose-linux-x86_64" \
            --output "${download}"
          printf '%s  %s\n' "${DOCKER_COMPOSE_LINUX_X86_64_SHA256}" "${download}" | sha256sum --check -
          install -m 0755 "${download}" "${compose_bin}"
          test "$(docker compose version --short)" = "${DOCKER_COMPOSE_VERSION#v}"

      - name: Validate recurring scan inventory
        run: bash scripts/ci/check-recurring-security-scan-contract.sh

      - name: Audit all npm lockfiles
        run: bash scripts/ci/run-npm-audit.sh
