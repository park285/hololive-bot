name: CI
run-name: CI · ${{ github.sha }}


on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOCACHE: /tmp/go-cache
  GOTMPDIR: /tmp

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout hololive-bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.work
          cache: false

      - name: Shell syntax
        run: bash scripts/ci/shell-syntax-sweep.sh

      - name: gofmt
        run: bash scripts/ci/check-gofmt.sh

  go-modules:
    name: go-${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: "off"
      GOPROXY: https://proxy.golang.org
      GOMAXPROCS: "2"
      GOMEMLIMIT: 5GiB
    strategy:
      fail-fast: false
      matrix:
        module:
          - hololive/hololive-api
          - hololive/hololive-alarm-worker
          - hololive/hololive-dbtest
          - hololive/hololive-shared
          - hololive/hololive-youtube-collector
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout hololive-bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ matrix.module == 'hololive/hololive-youtube-collector' && '0' || '1' }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.work
          cache-dependency-path: ${{ format('{0}/go.sum', matrix.module) }}

      - name: Setup Node for collector helper integration tests
        if: matrix.module == 'hololive/hololive-youtube-collector'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: hololive/hololive-youtube-collector/youtubejs/package-lock.json

      - name: Install collector helper dependencies
        if: matrix.module == 'hololive/hololive-youtube-collector'
        run: bash scripts/ci/public-pr-collector-helper-install.sh

      - name: Module tidy drift
        run: bash scripts/ci/public-pr-go-gate.sh "${{ matrix.module }}" tidy

      - name: Module vet
        run: bash scripts/ci/public-pr-go-gate.sh "${{ matrix.module }}" vet

      - name: Module race tests
        run: bash scripts/ci/public-pr-go-gate.sh "${{ matrix.module }}" race

  collector-helper:
    name: collector-helper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout hololive-bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: hololive/hololive-youtube-collector/youtubejs/package-lock.json

      - name: YouTube.js helper tests
        run: bash scripts/ci/public-pr-collector-helper-gate.sh

  fast-gate:
    name: fast-gate
    if: always()
    needs:
      - policy
      - go-modules
      - collector-helper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Require canonical verification
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          GO_MODULES_RESULT: ${{ needs.go-modules.result }}
          COLLECTOR_HELPER_RESULT: ${{ needs.collector-helper.result }}
        run: |
          test "${POLICY_RESULT}" = "success"
          test "${GO_MODULES_RESULT}" = "success"
          test "${COLLECTOR_HELPER_RESULT}" = "success"
