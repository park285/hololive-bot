name: CI
run-name: CI · ${{ github.sha }}


on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOCACHE: /tmp/go-cache
  GOTMPDIR: /tmp

jobs:
  go-modules:
    name: go-${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOWORK: "off"
      GOPROXY: https://proxy.golang.org
      GOMAXPROCS: "2"
      GOMEMLIMIT: 5GiB
    strategy:
      fail-fast: false
      matrix:
        module:
          - hololive/hololive-api
          - hololive/hololive-alarm-worker
          - hololive/hololive-dbtest
          - hololive/hololive-shared
          - hololive/hololive-collector
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout hololive-bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: ${{ matrix.module == 'hololive/hololive-collector' && '0' || '1' }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.work
          cache-dependency-path: ${{ format('{0}/go.sum', matrix.module) }}

      - name: Setup Node for collector helper integration tests
        if: matrix.module == 'hololive/hololive-collector'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: hololive/hololive-collector/youtubejs/package-lock.json

      - name: Install collector helper dependencies
        id: collector-install
        if: matrix.module == 'hololive/hololive-collector'
        run: bash scripts/ci/public-pr-collector-helper-install.sh

      - name: Module tidy drift
        run: bash scripts/ci/public-pr-go-gate.sh "${{ matrix.module }}" tidy

      - name: Module vet
        run: bash scripts/ci/public-pr-go-gate.sh "${{ matrix.module }}" vet

      - name: Module race tests
        run: bash scripts/ci/public-pr-go-gate.sh "${{ matrix.module }}" race

      - name: YouTube.js helper tests
        if: ${{ !cancelled() && steps.collector-install.outcome == 'success' }}
        timeout-minutes: 10
        working-directory: hololive/hololive-collector/youtubejs
        run: |
          npm run typecheck
          npm test

      - name: Event Grade helper tests
        if: matrix.module == 'hololive/hololive-collector'
        timeout-minutes: 5
        working-directory: hololive/hololive-collector/eventgrade
        run: npm test

  fast-gate:
    name: fast-gate
    if: always()
    needs: go-modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout hololive-bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.work
          cache: false

      - name: Setup Python for script tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version-file: .python-version

      - name: Provision script test prerequisites
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.7
          bash scripts/ci/python-runner.sh --print-interpreter
          test -x /usr/libexec/podman/quadlet
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          podman unshare unshare --mount true
          command -v rsync

      - name: Shell syntax
        run: bash scripts/ci/shell-syntax-sweep.sh

      - name: gofmt
        run: bash scripts/ci/check-gofmt.sh

      - name: Deploy and runtime script tests
        run: bash scripts/ci/run-script-tests.sh -json ./...

      - name: Require canonical verification
        if: always()
        env:
          GO_MODULES_RESULT: ${{ needs.go-modules.result }}
        run: test "${GO_MODULES_RESULT}" = "success"
