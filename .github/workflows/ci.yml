name: GPT Pro PR Verification
run-name: GPT Pro PR Verification · ${{ github.event.pull_request.head.sha || github.sha }}

# PUBLIC 저장소의 canonical PR gate. 비밀이 필요 없는 정책·Go·frontend 검증은
# GitHub Actions에서 독립적으로 증적을 남기고, 운영·배포·대용량 분석은 로컬 pre-push와
# non-PR security workflow가 계속 책임진다.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GOCACHE: /tmp/go-cache
  GOTMPDIR: /tmp

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout hololive-bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Show verification context
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'event=%s\nexpected_sha=%s\nchecked_out_sha=%s\n' \
            "${GITHUB_EVENT_NAME}" "${EXPECTED_SHA}" "${actual_sha}"
          test "${actual_sha}" = "${EXPECTED_SHA}"

      - name: Python runtime
        uses: ./.github/actions/python-runtime

      # gofmt 규칙은 릴리스마다 바뀐다. 이 단계가 없으면 러너 기본 Go로 검사해
      # go.mod가 요구하는 판본과 다른 결과를 낸다.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Show Go environment
        run: |
          go version
          go env GOOS GOARCH GOMOD GOWORK CGO_ENABLED

      - name: Workflow PR boundary and gate ownership
        run: bash scripts/ci/check-workflow-secrets.sh

      - name: Workflow CI ownership contract
        run: |
          "$CI_PYTHON_BIN" scripts/ci/check-workflow-ci-owner.py
          "$CI_PYTHON_BIN" scripts/ci/check-workflow-ci-owner_test.py

      - name: Shell syntax
        run: bash scripts/ci/shell-syntax-sweep.sh

      - name: gofmt
        run: bash scripts/ci/check-gofmt.sh

  go-modules:
    name: go-${{ matrix.module }}
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        module:
          - "."
          - admin-dashboard/backend
          - hololive/hololive-api
          - hololive/hololive-alarm-worker
          - hololive/hololive-dbtest
          - hololive/hololive-shared
          - hololive/hololive-youtube-collector
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout hololive-bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Show verification context
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'event=%s\nexpected_sha=%s\nchecked_out_sha=%s\n' \
            "${GITHUB_EVENT_NAME}" "${EXPECTED_SHA}" "${actual_sha}"
          test "${actual_sha}" = "${EXPECTED_SHA}"

      - name: Python runtime
        uses: ./.github/actions/python-runtime

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # leg별 캐시 키 분리 — 목록 공유 시 7개 leg가 같은 키를 놓고 경쟁해 6개가 영구 캐시 미스가 된다.
          cache-dependency-path: ${{ matrix.module == '.' && 'go.sum' || format('{0}/go.sum', matrix.module) }}

      - name: Show Go environment
        run: |
          go version
          go env GOOS GOARCH GOMOD GOWORK CGO_ENABLED

      - name: Setup Node for collector helper integration tests
        if: matrix.module == 'hololive/hololive-youtube-collector'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: hololive/hololive-youtube-collector/youtubejs/package-lock.json

      - name: Install collector helper dependencies
        if: matrix.module == 'hololive/hololive-youtube-collector'
        run: bash scripts/ci/public-pr-collector-helper-install.sh

      - name: Setup Docker Compose for repository contract tests
        if: matrix.module == 'hololive/hololive-shared'
        env:
          DOCKER_COMPOSE_VERSION: v2.39.4
          DOCKER_COMPOSE_LINUX_X86_64_SHA256: 7af95166a730b87e172d4fc9aefea8725d3c6c7327d59149267b452114ddb7d4
        run: |
          compose_dir="${HOME}/.docker/cli-plugins"
          compose_bin="${compose_dir}/docker-compose"
          download="${RUNNER_TEMP}/docker-compose-linux-x86_64"
          mkdir -p "${compose_dir}"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/docker/compose/releases/download/${DOCKER_COMPOSE_VERSION}/docker-compose-linux-x86_64" \
            --output "${download}"
          printf '%s  %s\n' "${DOCKER_COMPOSE_LINUX_X86_64_SHA256}" "${download}" | sha256sum --check -
          install -m 0755 "${download}" "${compose_bin}"
          test "$(docker compose version --short)" = "${DOCKER_COMPOSE_VERSION#v}"

      - name: Module tidy drift
        env:
          GOWORK: "off"
          GOMAXPROCS: "2"
          GOMEMLIMIT: 5GiB
        run: bash scripts/ci/public-pr-go-gate.sh "${{ matrix.module }}" tidy

      - name: Module vet
        env:
          GOWORK: "off"
          GOMAXPROCS: "2"
          GOMEMLIMIT: 5GiB
        run: bash scripts/ci/public-pr-go-gate.sh "${{ matrix.module }}" vet

      - name: Module unit tests
        env:
          GOWORK: "off"
          GOMAXPROCS: "2"
          GOMEMLIMIT: 5GiB
        run: bash scripts/ci/public-pr-go-gate.sh "${{ matrix.module }}" test

      - name: Module race tests
        env:
          GOWORK: "off"
          GOMAXPROCS: "2"
          GOMEMLIMIT: 5GiB
        run: bash scripts/ci/public-pr-go-gate.sh "${{ matrix.module }}" race

  frontend:
    name: frontend
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout hololive-bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Show verification context
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'event=%s\nexpected_sha=%s\nchecked_out_sha=%s\n' \
            "${GITHUB_EVENT_NAME}" "${EXPECTED_SHA}" "${actual_sha}"
          test "${actual_sha}" = "${EXPECTED_SHA}"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: admin-dashboard/backend/go.sum

      - name: Show Go environment
        run: |
          go version
          go env GOOS GOARCH GOMOD GOWORK CGO_ENABLED

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: admin-dashboard/frontend/package-lock.json

      - name: Frontend test, lint, generation and build gate
        env:
          GOWORK: "off"
        run: bash scripts/ci/public-pr-frontend-gate.sh

  collector-helper:
    name: collector-helper
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout hololive-bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Show verification context
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'event=%s\nexpected_sha=%s\nchecked_out_sha=%s\n' \
            "${GITHUB_EVENT_NAME}" "${EXPECTED_SHA}" "${actual_sha}"
          test "${actual_sha}" = "${EXPECTED_SHA}"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: hololive/hololive-youtube-collector/youtubejs/package-lock.json

      - name: YouTube.js helper tests
        run: bash scripts/ci/public-pr-collector-helper-gate.sh

  fast-gate:
    name: fast-gate
    if: always()
    needs:
      - policy
      - go-modules
      - frontend
      - collector-helper
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Require canonical verification
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          GO_MODULES_RESULT: ${{ needs.go-modules.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          COLLECTOR_HELPER_RESULT: ${{ needs.collector-helper.result }}
        run: |
          test "${POLICY_RESULT}" = "success"
          test "${GO_MODULES_RESULT}" = "success"
          test "${FRONTEND_RESULT}" = "success"
          test "${COLLECTOR_HELPER_RESULT}" = "success"
